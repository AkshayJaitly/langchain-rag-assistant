name: Backend tests

# The suite runs entirely offline: the Prompt Guard classifier is disabled in
# conftest, so no API key is needed and nothing here calls a provider.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the runtime in backend/Dockerfile.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit, integration and BDD suites
        run: python -m pytest -q

      - name: Retrieval evaluation
        # Deterministic: embeddings only, no provider call, so it can gate every
        # change. The floor catches a retrieval regression that unit tests
        # cannot see. Answer quality needs a judge and stays a manual run.
        env:
          EMBEDDING_BACKEND: fastembed
          GUARD_ENABLED: "false"
          CHROMA_DIR: /tmp/eval/chroma
          DOCSTORE_DIR: /tmp/eval/docstore
          UPLOAD_DIR: /tmp/eval/uploads
        run: python -m eval.run --retrieval --min-recall 0.9 --json /tmp/eval-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: /tmp/eval-report.json
          if-no-files-found: ignore
