name: Deploy frontend to GitHub Pages

# Builds the React frontend and publishes it to GitHub Pages.
# No secrets are baked into the bundle. To point the UI at a hosted backend,
# set a repository variable VITE_API_BASE (Settings → Secrets and variables →
# Actions → Variables) to your backend URL, e.g. https://your-backend.onrender.com

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          # Sets the Pages sub-path base and (optionally) the backend URL.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
